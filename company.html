<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سایت شرکتی</title>
<style>
:root{--bar:46px;--h:220;--a:hsl(var(--h) 70% 46%);--a2:hsl(calc(var(--h) + 35) 70% 38%);--bg:#fff;--bg2:#f4f6fb;--tx:#1f2937;--mu:#6b7280;--bd:#e5e7eb;--on:#fff}
body.dark{--bg:#0e1117;--bg2:#161b24;--tx:#eef1f6;--mu:#9aa4b5;--bd:#262d3a;--a:hsl(var(--h) 80% 58%);--a2:hsl(calc(var(--h) + 35) 80% 48%)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--tx);line-height:1.9}
a{color:inherit;text-decoration:none}
button,input,textarea{font-family:inherit}
.top{position:sticky;top:var(--bar);z-index:40;display:flex;align-items:center;gap:20px;padding:12px 28px;background:var(--bg);border-bottom:1px solid var(--bd)}
.brand{font-weight:800;color:var(--a);font-size:1.2rem;margin-left:auto}
.top nav{display:flex;gap:22px;color:var(--mu);font-size:.95rem}
.top nav a:hover{color:var(--a)}
.btn{display:inline-block;padding:9px 24px;border-radius:10px;background:var(--a);color:var(--on);border:none;font-size:.95rem;cursor:pointer}
.btn.w{background:var(--on);color:var(--a2)}
.btn.o{background:transparent;border:2px solid var(--on);color:var(--on)}
.hero{padding:76px 28px;background:linear-gradient(135deg,var(--a),var(--a2));color:var(--on)}
.hero.split{display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:center}
.hero.center{text-align:center;display:flex;flex-direction:column-reverse;align-items:center}
.hero h1{font-size:2.5rem;line-height:1.4;margin:8px 0}
.hero p{opacity:.92;margin-bottom:22px;max-width:520px}
.hero.center p{margin-inline:auto}
.hero .btn{margin:3px}
.pill{display:inline-block;padding:2px 16px;border-radius:99px;background:rgba(255,255,255,.2);font-size:.82rem}
.art{font-size:9rem;text-align:center;filter:drop-shadow(0 14px 26px rgba(0,0,0,.3))}
.hero.center .art{font-size:4.5rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;max-width:900px;margin:-34px auto 0;padding:0 20px;position:relative}
.stats div{background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:18px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.stats b{display:block;font-size:1.9rem;color:var(--a)}
.stats span{color:var(--mu);font-size:.88rem}
section{max-width:1100px;margin:auto;padding:64px 22px;text-align:center}
section.alt{max-width:none;background:var(--bg2)}
section.alt>*{max-width:1100px;margin-inline:auto}
section h2{font-size:1.7rem;margin-bottom:4px}
.sub{color:var(--mu);margin-bottom:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:18px;padding:26px 18px;transition:.25s}
.alt .card{background:var(--bg)}
.card:hover{transform:translateY(-6px);border-color:var(--a)}
.card .e{font-size:2.4rem}
.card p{color:var(--mu);font-size:.9rem}
.proj{border-radius:18px;overflow:hidden;border:1px solid var(--bd);background:var(--bg)}
.proj .t{height:150px;display:flex;align-items:center;justify-content:center;font-size:3.6rem;background:linear-gradient(135deg,var(--a),var(--a2))}
.proj h4{padding:12px}
.quote{max-width:640px;margin:auto;font-size:1.15rem;min-height:84px;transition:opacity .4s}
.form{display:flex;flex-direction:column;gap:12px;max-width:480px;margin:auto}
.form input,.form textarea{padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx)}
.foot{text-align:center;padding:26px;color:var(--mu);border-top:1px solid var(--bd);font-size:.9rem}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:10px 22px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:200;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:700px){.top nav{display:none}.hero.split{grid-template-columns:1fr;text-align:center}.hero.split .art{order:-1;font-size:5rem}.hero h1{font-size:1.8rem}.hero p{margin-inline:auto}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script>
const D={
tech:{h:220,dark:1,em:'💻',title:'نوآوران فناوری',tag:'راهکارهای نرم‌افزاری برای رشد کسب‌وکار شما',cta:'درخواست مشاوره',lay:'split',
 sv:[['🧩','توسعه نرم‌افزار','نرم‌افزار اختصاصی متناسب با نیاز شما'],['☁️','خدمات ابری','مهاجرت و مدیریت زیرساخت'],['🤖','هوش مصنوعی','اتوماسیون و تحلیل هوشمند داده'],['🔐','امنیت سایبری','محافظت از داده‌های سازمان']],
 st:[[120,'+','پروژه موفق'],[45,'','متخصص'],[9,'','سال تجربه']],pj:[['📱','اپلیکیشن بانکی'],['🛒','پلتفرم فروش'],['📊','داشبورد تحلیلی']],
 qt:['«تیم فوق‌العاده‌ای دارند؛ پروژه ما زودتر از موعد تحویل شد.»','«کیفیت کار و پشتیبانی‌شون عالیه.»']},
construction:{h:28,em:'🏗️',title:'گروه عمران آرمان',tag:'ساخت مطمئن، تحویل به‌موقع',cta:'استعلام قیمت',lay:'center',
 sv:[['🏢','ساخت و ساز','ساختمان‌های مسکونی و تجاری'],['📐','طراحی معماری','نقشه و طراحی سه‌بعدی'],['🛋️','دکوراسیون داخلی','اجرای کامل فضای داخلی'],['🔧','بازسازی','نوسازی و مقاوم‌سازی']],
 st:[[85,'+','پروژه تحویل‌شده'],[22,'','سال سابقه'],[300,'+','مهندس و کارگر']],pj:[['🏙️','برج مسکونی نگین'],['🏬','مجتمع تجاری پارس'],['🏡','ویلای ساحلی']],
 qt:['«آپارتمانمون دقیقاً مثل نقشه ساخته شد.»','«نظارت و کیفیت اجرا عالی بود.»']},
consulting:{h:160,em:'📊',title:'مشاوران پیشرو',tag:'تصمیم‌های هوشمند، رشد پایدار',cta:'رزرو جلسه مشاوره',lay:'split',
 sv:[['📈','مشاوره مدیریت','بهینه‌سازی ساختار و فرآیندها'],['💰','مشاوره مالی','برنامه‌ریزی و کنترل هزینه'],['🎯','برندسازی','هویت و استراتژی برند'],['👥','منابع انسانی','جذب و توسعه نیروها']],
 st:[[200,'+','سازمان مشتری'],[15,'','مشاور ارشد'],[96,'٪','رضایت مشتری']],pj:[['🏦','بازطراحی ساختار بانک'],['🏭','کاهش هزینه تولید'],['🛍️','برندسازی زنجیره خرده‌فروشی']],
 qt:['«فروشمون در ۶ ماه ۴۰٪ بیشتر شد.»','«تحلیل‌هاشون دقیق و کاربردی بود.»']},
legal:{h:42,dark:1,on:'#111',em:'⚖️',title:'دفتر وکالت عدالت',tag:'حق شما، تعهد ما',cta:'وقت مشاوره',lay:'center',
 sv:[['⚖️','دعاوی حقوقی','وکالت در تمام مراحل دادرسی'],['📝','تنظیم قرارداد','قراردادهای دقیق و بی‌نقص'],['🏢','ثبت شرکت','ثبت سریع و کامل'],['🛡️','مالکیت فکری','ثبت برند و اختراع']],
 st:[[1200,'+','پرونده موفق'],[18,'','سال تجربه'],[12,'','وکیل پایه‌یک']],pj:[['🏛️','دعوای ملکی'],['🤝','قرارداد بین‌المللی'],['🏢','ثبت شرکت سهامی']],
 qt:['«با حوصله و دقت پرونده من رو پیگیری کردند.»','«مطمئن‌ترین دفتر حقوقی که دیدم.»']},
industry:{h:15,em:'🏭',title:'صنایع پارس‌تولید',tag:'کیفیت صنعتی، صادرات جهانی',cta:'درخواست همکاری',lay:'split',
 sv:[['🏭','تولید انبوه','خط تولید پیشرفته'],['🚚','حمل و لجستیک','ناوگان اختصاصی'],['🌍','صادرات','ارسال به بیش از ۳۰ کشور'],['⚙️','قطعات صنعتی','ساخت قطعه سفارشی']],
 st:[[35,'','کشور مقصد'],[500,'+','محصول'],[1200,'','ظرفیت روزانه']],pj:[['🔩','قطعات خودرو'],['🧰','ابزار صنعتی'],['📦','بسته‌بندی صنعتی']],
 qt:['«تحویل به‌موقع و کیفیت ثابت.»','«شریک تجاری قابل‌اعتماد.»']}
};
const q=new URLSearchParams(location.search);
const k=D[q.get('k')]?q.get('k'):'tech',S=D[k],$=id=>document.getElementById(id);
const R=document.documentElement.style;R.setProperty('--h',S.h);R.setProperty('--on',S.on||'#fff');
if(S.dark)document.body.classList.add('dark');
document.title=S.title;
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400)}
$('app').innerHTML=`
<header class="top"><div class="brand">${S.em} ${S.title}</div><nav><a href="#sv">خدمات</a><a href="#pj">پروژه‌ها</a><a href="#tm">تیم</a><a href="#ct">تماس</a></nav><a href="#ct" class="btn">${S.cta}</a></header>
<div class="hero ${S.lay}"><div><span class="pill">شریک مطمئن شما</span><h1>${S.title}</h1><p>${S.tag}</p><a class="btn w" href="#sv">خدمات ما</a><a class="btn o" href="#ct">${S.cta}</a></div><div class="art">${S.em}</div></div>
<div class="stats">${S.st.map(s=>`<div><b data-n="${s[0]}" data-s="${s[1]}">۰</b><span>${s[2]}</span></div>`).join('')}</div>
<section id="sv"><h2>خدمات ما</h2><p class="sub">آنچه برای موفقیت شما انجام می‌دهیم</p><div class="grid">${S.sv.map(s=>`<div class="card"><div class="e">${s[0]}</div><h4>${s[1]}</h4><p>${s[2]}</p></div>`).join('')}</div></section>
<section class="alt" id="pj"><h2>پروژه‌های منتخب</h2><p class="sub">نمونه‌ای از کارهای انجام‌شده</p><div class="grid">${S.pj.map((p,i)=>`<div class="proj"><div class="t" style="filter:hue-rotate(${i*40}deg)">${p[0]}</div><h4>${p[1]}</h4></div>`).join('')}</div></section>
<section id="tm"><h2>تیم ما</h2><p class="sub">افرادی که پشت موفقیت‌ها هستند</p><div class="grid"><div class="card"><div class="e">👨‍💼</div><h4>مدیرعامل</h4><p>رهبری و استراتژی</p></div><div class="card"><div class="e">👩‍💻</div><h4>مدیر فنی</h4><p>کیفیت و اجرا</p></div><div class="card"><div class="e">👩‍💼</div><h4>مدیر ارتباطات</h4><p>پشتیبانی مشتریان</p></div></div></section>
<section class="alt"><h2>نظر مشتریان</h2><p class="sub">&nbsp;</p><div class="quote" id="quote"></div></section>
<section id="ct"><h2>${S.cta}</h2><p class="sub">فرم زیر را پر کنید تا با شما تماس بگیریم</p>
<form class="form" id="form"><input id="fn" placeholder="نام شما" required><input placeholder="شماره تماس" required><textarea rows="4" placeholder="پیام شما"></textarea><button class="btn">ارسال درخواست</button></form></section>
<div class="foot">© ${S.title} - تمام حقوق محفوظ است</div>`;
$('form').onsubmit=e=>{e.preventDefault();toast('ممنون '+$('fn').value+'، درخواستت ثبت شد ✅');e.target.reset()};
let qi=0;const qe=$('quote');
function showQ(){qe.style.opacity=0;setTimeout(()=>{qe.textContent=S.qt[qi%S.qt.length]+' — مدیر یکی از مشتریان';qe.style.opacity=1;qi++},300)}
showQ();setInterval(showQ,4500);
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;io.unobserve(e.target);const el=e.target,t=+el.dataset.n,s=el.dataset.s;let n=0;const st=Math.max(1,Math.ceil(t/50));const tm=setInterval(()=>{n=Math.min(t,n+st);el.textContent=n.toLocaleString('fa-IR')+s;if(n>=t)clearInterval(tm)},25)}),{threshold:.4});
document.querySelectorAll('[data-n]').forEach(el=>io.observe(el));
injectDemoBar(q.get('n')||S.title,q.get('p')?(+q.get('p')).toLocaleString('fa-IR')+' تومان':'');
</script>
</body>
</html>
